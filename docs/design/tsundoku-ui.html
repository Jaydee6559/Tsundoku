<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tsundoku UI Design</title>
<style>
@page { size: A4 landscape; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: "Segoe UI", Roboto, sans-serif; color: #3B342C; background: #FDFBF7; }
.serif { font-family: Georgia, "Times New Roman", serif; }

.light { --bg:#F5EFE6; --sf:#FBF7F0; --sf2:#EFE6D8; --tx:#3B342C; --tx2:#7A6F62; --bd:#E4D9C8;
  --ac:#A0673E; --acS:#EEDCCB; --acI:#7A4A26; --onAc:#FFFFFF;
  --sg:#7C8B6F; --sgS:#E2E6D9; --sgI:#4F5D42;
  --plS:#E8E1D6; --plI:#6E655A; --hoS:#F1E3C4; --hoI:#7A5A22; --drS:#F0D6D0; --drI:#8A3F35; --scrim:rgba(59,52,44,.35); }
.dark { --bg:#1E1B18; --sf:#2A2622; --sf2:#332E29; --tx:#E8DFD3; --tx2:#A89C8E; --bd:#3B352F;
  --ac:#D19A6C; --acS:#4A3526; --acI:#EBC3A0; --onAc:#1E1B18;
  --sg:#A3B193; --sgS:#353A2E; --sgI:#C2CDB3;
  --plS:#39332D; --plI:#BFB3A4; --hoS:#45391F; --hoI:#E3C78F; --drS:#4A2C28; --drI:#E7B1A8; --scrim:rgba(0,0,0,.5); }

.page { width: 297mm; height: 210mm; padding: 11mm 13mm; page-break-after: always; position: relative; overflow: hidden; }
.page:last-child { page-break-after: auto; }
.ph-title { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 6mm; border-bottom: 1px solid #E4D9C8; padding-bottom: 3mm; }
.ph-title h2 { font-family: Georgia, serif; font-weight: 400; font-size: 22px; color:#3B342C; }
.ph-title span { font-size: 11px; color:#7A6F62; letter-spacing:.04em; }
.foot { position:absolute; bottom:6mm; left:13mm; right:13mm; font-size:9px; color:#A89C8E; display:flex; justify-content:space-between; }

.row3 { display:flex; justify-content:space-between; gap: 8mm; }
.col { width: 82mm; display:flex; flex-direction:column; align-items:center; }
.cap { margin-top: 4mm; width: 100%; }
.cap h3 { font-family: Georgia, serif; font-weight:400; font-size: 14px; margin-bottom: 1.5mm; color:#3B342C; }
.cap ul { list-style: none; font-size: 10px; color:#7A6F62; line-height: 1.5; }
.cap li::before { content: "·  "; color:#A0673E; font-weight:700; }

/* phone */
.phone { width: 252px; height: 520px; border-radius: 30px; background:#2B2723; padding: 6px; flex-shrink:0; }
.scr { width:100%; height:100%; border-radius: 25px; background: var(--bg); color: var(--tx); overflow:hidden; position:relative; display:flex; flex-direction:column; font-size: 11px; }
.sb { height: 22px; display:flex; justify-content:space-between; align-items:center; padding: 0 16px; font-size: 9.5px; color: var(--tx2); flex-shrink:0; }
.ab { display:flex; align-items:center; gap:10px; padding: 6px 14px 8px; flex-shrink:0; }
.ab .t { font-family: Georgia, serif; font-size: 19px; flex:1; }
.ab .t.sm { font-size: 15px; }
.content { flex:1; overflow:hidden; padding: 0 14px; position:relative; }
.nav { height: 50px; flex-shrink:0; display:flex; justify-content:space-around; align-items:center; background: var(--sf); border-top: 1px solid var(--bd); }
.nav div { display:flex; flex-direction:column; align-items:center; gap:2px; font-size: 8.5px; color: var(--tx2); }
.nav .on { color: var(--acI); }
.nav .on .pill { background: var(--acS); }
.pill { padding: 3px 14px; border-radius: 12px; display:flex; }

svg.i { width: 17px; height: 17px; fill:none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink:0; }
svg.i.s { width: 13px; height: 13px; }
svg.i.l { width: 26px; height: 26px; }

.card { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 10px; }
.chip { display:inline-flex; align-items:center; gap:3px; padding: 3px 9px; border-radius: 20px; font-size: 9.5px; white-space:nowrap; }
.c-rd { background: var(--acS); color: var(--acI); }
.c-cp { background: var(--sgS); color: var(--sgI); }
.c-pl { background: var(--plS); color: var(--plI); }
.c-ho { background: var(--hoS); color: var(--hoI); }
.c-dr { background: var(--drS); color: var(--drI); }
.c-ol { border: 1px solid var(--bd); color: var(--tx2); }
.c-on { background: var(--tx); color: var(--bg); }
.btn { display:flex; align-items:center; justify-content:center; gap:6px; border-radius: 22px; padding: 9px 14px; font-size: 11.5px; font-weight: 600; }
.btn-p { background: var(--ac); color: var(--onAc); }
.btn-s { border: 1px solid var(--bd); color: var(--tx); background: var(--sf); }
.btn-t { color: var(--acI); }
.muted { color: var(--tx2); }
.lbl { font-size: 10px; color: var(--tx2); text-transform: none; letter-spacing:.03em; margin: 12px 0 6px; display:flex; justify-content:space-between; }
.lbl b { font-weight:600; color: var(--tx); font-size: 11.5px; letter-spacing:0; }
.bar { height: 5px; border-radius: 3px; background: var(--sf2); overflow:hidden; }
.bar i { display:block; height:100%; background: var(--ac); border-radius:3px; }

.cov { border-radius: 4px 6px 6px 4px; position:relative; overflow:hidden; color: rgba(255,255,255,.92); display:flex; flex-direction:column; justify-content:flex-end; padding: 5px; flex-shrink:0; }
.cov::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background: rgba(0,0,0,.12); }
.cov .ct { font-family: Georgia, serif; font-size: 8px; line-height:1.15; position:relative; }
.cov .ln { position:absolute; top: 18%; left: 12%; right: 12%; height: 1px; background: rgba(255,255,255,.45); }

.li { display:flex; gap:10px; align-items:center; padding: 8px 0; border-bottom: 1px solid var(--bd); }
.li:last-child { border-bottom: none; }
.li .m { flex:1; min-width:0; }
.li .tt { font-size: 11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li .st { font-size: 9.5px; color: var(--tx2); margin-top:2px; }
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.field { display:flex; align-items:center; gap:8px; background: var(--sf); border:1px solid var(--bd); border-radius: 22px; padding: 8px 12px; color: var(--tx2); }
.chips { display:flex; gap:5px; flex-wrap:nowrap; overflow:hidden; }
.tog { width: 30px; height: 17px; border-radius: 9px; background: var(--sf2); position:relative; border:1px solid var(--bd); flex-shrink:0; }
.tog::after { content:""; position:absolute; width:11px; height:11px; border-radius:50%; background: var(--tx2); top:2px; left:2px; }
.tog.on { background: var(--ac); border-color: var(--ac); }
.tog.on::after { left: 15px; background: var(--onAc); }
.set { display:flex; align-items:center; gap:10px; padding: 7px 0; }
.set .m { flex:1; }
.set .tt { font-size: 11px; }
.set .st { font-size: 9px; color: var(--tx2); margin-top:1px; }
.sheet { position:absolute; left:0; right:0; bottom:0; background: var(--sf); border-radius: 22px 22px 0 0; padding: 8px 16px 16px; }
.handle { width: 34px; height: 4px; border-radius: 2px; background: var(--bd); margin: 0 auto 10px; }
.scrim { position:absolute; inset:0; background: var(--scrim); }
.check { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--tx2); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.check.on { background: var(--ac); border-color: var(--ac); color: var(--onAc); }
.snack { position:absolute; left: 10px; right: 10px; bottom: 60px; background: var(--tx); color: var(--bg); border-radius: 10px; padding: 9px 12px; display:flex; justify-content:space-between; align-items:center; font-size: 10.5px; }
.snack b { color: var(--acS); font-weight:600; }

/* design system page */
.ds { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 7mm; }
.ds h4 { font-family: Georgia, serif; font-weight:400; font-size: 14px; margin-bottom: 3mm; }
.sw { display:flex; align-items:center; gap: 8px; margin-bottom: 5px; font-size: 10px; }
.sw i { width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(0,0,0,.08); display:block; flex-shrink:0; }
.sw .n { width: 78px; color:#3B342C; }
.sw .h { color:#7A6F62; font-family: Consolas, monospace; font-size: 9.5px; width: 58px; }
.note { font-size: 10px; color:#7A6F62; line-height:1.55; }
.note b { color:#3B342C; font-weight:600; }
.box { border:1px solid #E4D9C8; border-radius: 12px; padding: 4mm; background:#FBF7F0; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
 <defs>
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="books" viewBox="0 0 24 24"><rect x="4" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M16.5 5.5l3.5 1-3 13.5-3.5-1"/></symbol>
  <symbol id="layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  <symbol id="settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/></symbol>

  <symbol id="more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>

  <symbol id="grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
  <symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></symbol>
  <symbol id="undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.8 6 6.2.6-4.8 4.2 1.6 6.2L12 16.6 6.2 20l1.6-6.2L3 9.6 9.2 9z"/></symbol>
  <symbol id="starf" viewBox="0 0 24 24"><path d="M12 3l2.8 6 6.2.6-4.8 4.2 1.6 6.2L12 16.6 6.2 20l1.6-6.2L3 9.6 9.2 9z" fill="currentColor"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
  <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>

  <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>

  <symbol id="wifi0" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.5a5 5 0 017 0M5 12.5a10 10 0 015-2.6M12 20h.01"/></symbol>
  <symbol id="drag" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1" fill="currentColor"/><circle cx="15" cy="6" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="18" r="1" fill="currentColor"/><circle cx="15" cy="18" r="1" fill="currentColor"/></symbol>
  <symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="note" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-3.8M8.2 13l7.6 3.8"/></symbol>
 </defs>
</svg>

<div id="root"></div>

<script>
const I = (n, c='') => `<svg class="i ${c}"><use href="#${n}"/></svg>`;
const COLORS = ['#A0673E','#7C8B6F','#6F7F96','#9C6B7A','#B8935A','#5E6B5C','#8A7A9C','#A4775B','#7E6A55','#6B8584'];
const BOOKS = [
 ['A Thousand Lanterns','Mei Arakawa','Lantern Saga',2],
 ['The Ashen Archive','R. K. Vale','Ashen Archive',4],
 ['Moonlit Cartographer','Sora Hime','',0],
 ['Tower of Quiet Rain','L. Tamsin','Quiet Rain',1],
 ['The Last Alchemist','Dain Morrow','',0],
 ['Saltwind Chronicles','Iris Penhale','Saltwind',3],
 ['Garden of Iron Roses','Yuki Sendo','',0],
 ['Starfall Academy','K. Ito','Starfall',6],
 ['Ember and Ink','Hana Ro','',0],
 ['The Glass Monastery','Theo Wren','',0],
 ['Seventh Sword Saint','Jin Hayate','Sword Saint',7],
 ['Paper Moon Bakery','Aiko Mori','',0],
];
const cov = (i, w, h, t) => `<div class="cov" style="width:${w}px;height:${h}px;background:${COLORS[i%COLORS.length]}"><span class="ln"></span>${t?`<span class="ct">${t}</span>`:''}</div>`;
const status = {rd:['Reading','c-rd'], cp:['Completed','c-cp'], pl:['Plan to read','c-pl'], ho:['On hold','c-ho'], dr:['Dropped','c-dr']};
const chip = (k, extra='') => `<span class="chip ${status[k][1]}">${extra}${status[k][0]}</span>`;
const sb = () => `<div class="sb"><span>9:41</span><span>▴ ▮ 86%</span></div>`;
const nav = (on) => `<div class="nav">${[['home','Home'],['books','Library'],['layers','Series'],['settings','Settings']].map(([ic,l])=>`<div class="${l===on?'on':''}"><span class="pill">${I(ic)}</span>${l}</div>`).join('')}</div>`;
const phone = (inner, theme='light') => `<div class="phone"><div class="scr ${theme}">${sb()}${inner}</div></div>`;
const col = (ph, title, notes) => `<div class="col">${ph}<div class="cap"><h3>${title}</h3><ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul></div></div>`;
const page = (title, sub, body, n) => `<section class="page"><div class="ph-title"><h2>${title}</h2><span>${sub}</span></div>${body}<div class="foot"><span>Tsundoku · UI design v0.1 · Paper and ink</span><span>${n}</span></div></section>`;

/* ---------- screens ---------- */
const welcome = (th) => phone(`
 <div class="content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px">
  <div style="display:flex;align-items:flex-end;gap:3px;margin-bottom:22px">
   ${[[0,70],[3,84],[1,62],[6,92],[4,76],[2,68]].map(([c,h],k)=>`<div style="width:${k===3?20:15}px;height:${h}px;border-radius:3px;background:${COLORS[c]}"></div>`).join('')}
  </div>
  <div class="serif" style="font-size:30px">Tsundoku</div>
  <div class="serif muted" style="font-size:14px;margin:2px 0 14px">積ん読</div>
  <div class="muted" style="font-size:11.5px;line-height:1.55">Every EPUB on your phone, in one calm place. Track what you read in ReadEra and keep the pile in order.</div>
 </div>
 <div style="padding:0 18px 22px"><div class="btn btn-p">Get started</div><div class="btn btn-t" style="margin-top:4px">Restore from backup</div></div>`, th);

const permission = () => phone(`
 <div class="ab"><span class="muted">${I('back')}</span><span class="t sm"></span><span class="muted" style="font-size:10px">Step 1 of 2</span></div>
 <div class="content" style="padding:0 20px">
  <div style="width:58px;height:58px;border-radius:18px;background:var(--acS);color:var(--acI);display:flex;align-items:center;justify-content:center;margin:12px 0 16px">${I('folder','l')}</div>
  <div class="serif" style="font-size:21px;line-height:1.2">Find every EPUB<br>on your phone</div>
  <div class="muted" style="font-size:11px;line-height:1.55;margin:10px 0 16px">Your books are spread across folders. Tsundoku needs <b style="color:var(--tx)">All files access</b> to find them and notice new ones right away.</div>
  ${[['lock','Stays on your phone','No internet permission at all'],['eye','Read-only by default','Your EPUB files are never changed'],['trash','Deletes go to Trash first','Undo anytime for 30 days']].map(([ic,a,b])=>`
  <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:11px"><span style="color:var(--sg)">${I(ic)}</span><div><div style="font-weight:600;font-size:11px">${a}</div><div class="muted" style="font-size:9.5px">${b}</div></div></div>`).join('')}
 </div>
 <div style="padding:0 18px 20px"><div class="btn btn-p">Allow all files access</div><div class="muted" style="text-align:center;font-size:9px;margin-top:7px">Opens Android settings · turn on Tsundoku, then come back</div></div>`);

const scanning = () => phone(`
 <div class="ab"><span class="t sm"></span><span class="muted" style="font-size:10px">Step 2 of 2</span></div>
 <div class="content" style="padding:0 20px">
  <div class="serif" style="font-size:21px;margin-top:6px">Building your library</div>
  <div class="muted" style="font-size:10.5px;margin:4px 0 18px">Reading titles and covers. Books appear as they're found.</div>
  <div style="display:flex;align-items:baseline;gap:6px"><span class="serif" style="font-size:38px;color:var(--ac)">312</span><span class="muted">EPUBs found</span></div>
  <div class="bar" style="margin:8px 0 4px;height:6px"><i style="width:72%"></i></div>
  <div class="muted" style="font-size:9.5px;display:flex;justify-content:space-between"><span>Reading covers…</span><span>72%</span></div>
  <div class="lbl" style="margin-top:18px"><b>Found in</b></div>
  <div class="card" style="padding:4px 12px">
   ${[['Download',142],['Telegram',98],['Documents',51],['Books',21]].map(([f,c])=>`<div class="li"><span class="muted">${I('folder','s')}</span><div class="m" style="font-size:11px">${f}</div><span class="muted" style="font-size:10px">${c}</span></div>`).join('')}
  </div>
  <div style="display:flex;gap:6px;margin-top:10px;align-items:center" class="muted"><span style="font-size:10px">Skipped: DCIM, Pictures, Music, Android/data</span></div>
 </div>
 <div style="padding:0 18px 20px"><div class="btn btn-p">Open library</div></div>`);

const home = (th) => phone(`
 <div class="ab"><span class="t">Tsundoku</span><span class="muted">${I('search')}</span></div>
 <div class="content">
  <div class="muted" style="font-size:10.5px;margin-bottom:8px">Good evening · 41 reading · 160 in the pile</div>
  <div class="card" style="display:flex;gap:11px;padding:11px">
   ${cov(0,62,92,'A Thousand Lanterns')}
   <div style="flex:1;display:flex;flex-direction:column">
    <div class="muted" style="font-size:9px;letter-spacing:.04em">CONTINUE READING</div>
    <div class="serif" style="font-size:13.5px;margin:3px 0 1px;line-height:1.2">A Thousand Lanterns</div>
    <div class="muted" style="font-size:9.5px">Lantern Saga · Vol 2</div>
    <div style="margin-top:auto"><div class="muted" style="font-size:9px;display:flex;justify-content:space-between;margin-bottom:3px"><span>Ch 38 of 62</span><span>61%</span></div><div class="bar"><i style="width:61%"></i></div></div>
