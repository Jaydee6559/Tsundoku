name: Build debug APK

# Pushes to main are built by release.yml (signed + published).
# This workflow checks pull requests and other branches, and can be run by hand.
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "scripts/**"
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push cancels the older, still-running build for the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Caches downloads between runs and checks the Gradle wrapper jar is the genuine one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tsundoku-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
