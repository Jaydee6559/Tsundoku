name: Release (signed APK)

# Every push to main publishes a signed, installable APK as a GitHub pre-release.
# Obtainium on the phone watches these releases and offers the update.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "scripts/**"
  workflow_dispatch:

# Default: read-only. The release job below asks for write access only for itself.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never cancel a half-published release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed to create releases and tags

    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/SETUP-SIGNING.md)"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TSUNDOKU_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TSUNDOKU_BUILD_NUMBER: ${{ github.run_number }}
          TSUNDOKU_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TSUNDOKU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TSUNDOKU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:testReleaseUnitTest

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare APK
        id: apk
        run: |
          base=$(grep -oP 'baseVersionName = "\K[^"]+' app/build.gradle.kts)
          version="$base-dev.$BUILD_NUMBER"
          src=app/build/outputs/apk/release/app-release.apk
          test -f "$src" || { echo "::error::Signed APK not found (was it signed?)"; exit 1; }
          mkdir -p out
          cp "$src" "out/tsundoku-$version.apk"
          (cd out && sha256sum "tsundoku-$version.apk" > "tsundoku-$version.apk.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "Development build **$VERSION**"
            echo
            echo "Commit: \`${COMMIT_SHA:0:7}\`"
            echo
            echo '```'
            printf '%s\n' "${COMMIT_MSG:-manual run}"
            echo '```'
          } > notes.md
          gh release create "v$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "Tsundoku $VERSION" \
            --notes-file notes.md \
            --prerelease

      - name: Keep only the 10 newest dev releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | tail -n +11 \
            | while read -r tag; do
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
